  <clipPath id="g"><path d="M723.2 355.0 A268 268 0 1 0 780.0 520.0 L560.0 520.0 L538.0 570.0 L560.0 620.0 L636.9 620.0 A160 160 0 1 1 638.1 421.5 Z"/></clipPath>
