name = "goldos-api"
main = "src/app.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
WEB_ORIGIN = "https://goldos-web.thufailahamed627.workers.dev,http://localhost:3000"
# The platform account this data plane serves. Set it to the tenant id shown
# in the admin portal once the shop's account exists; leave unset for an
# unmanaged single-shop install (no gate, no limits).
# TENANT_ID = ""

# Accounts assistant. Every model call goes to Workers AI through AI Gateway
# (dashboard: AI > AI Gateway; "default" is created on first use). The
# fallback model answers only when the primary errors or returns nothing.
AI_GATEWAY_ID = "default"
ASSISTANT_MODEL = "@cf/zai-org/glm-5.3-flash"
ASSISTANT_FALLBACK_MODEL = "@cf/zai-org/glm-4.7-flash"
ASSISTANT_REASONING_EFFORT = "high"
ASSISTANT_VISION_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"

# Secrets (never in this file):
#   wrangler secret put PLATFORM_BOOTSTRAP_TOKEN   # one-time: creates the first super admin
#   wrangler secret put CLOUDFLARE_ACCOUNT_ID      # SaaS: auto-creates one D1 per signup
#   wrangler secret put CLOUDFLARE_D1_API_TOKEN    # SaaS: API token with D1 edit rights
# Selling? Workers Paid is required past 10 databases (Free caps at 10).
# Set WEB_ORIGIN to the app origin (https://app.<domain>,http://localhost:3000)
# once the domain is live — shop cookies are SameSite=None; Secure.

[[d1_databases]]
binding = "DB"
database_name = "goldos"
database_id = "27c637f8-6a15-4012-bd7e-8b7b601df400"

# Control plane: accounts, plans, billing, staff. Create it once with
#   wrangler d1 create goldos-platform
# and paste the id it prints here.
[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "goldos-platform"
database_id = "4aa27d78-db29-42c8-b76f-295f30d48dc4"
migrations_dir = "drizzle-platform"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "R2"
bucket_name = "goldos-assets"

[triggers]
# Hourly: billing cycle + housekeeping. Nightly 02:15 UTC: usage collection.
crons = ["0 * * * *", "15 2 * * *"]
